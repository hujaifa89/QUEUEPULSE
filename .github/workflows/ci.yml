name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjS5Snfyzj0OgTWGainTXuYIFFPr954WaZE6E
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service_role_key
  VAPID_PRIVATE_KEY: dummy_vapid_private_key
  VAPID_SUBJECT: mailto:admin@queuepulse.local
  SMS_PROVIDER: mock
  CRON_SECRET: dummy_cron_secret_replace_in_production_min_32_chars

jobs:
  verify:
    name: Lint, Typecheck, Unit Tests & Coverage, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit Tests with Coverage (Target 70% NFR-08)
        run: npm run test:coverage

      - name: Run Next.js Build
        run: npm run build

  database-and-integration:
    name: Supabase pgTAP & Integration Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Run pgTAP Database Tests
        run: npm run test:db

      - name: Run Integration Tests
        run: npm run test:integration

  e2e:
    name: Playwright End-to-End & Accessibility Tests
    runs-on: ubuntu-latest
    needs: database-and-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Seed Database Users
        run: npm run seed:users

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Including Axe Core)
        run: npm run test:e2e
